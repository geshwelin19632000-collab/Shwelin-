<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a25">
  <meta name="description" content="A responsive weather dashboard powered by Open-Meteo.">
  <title>Weather — Shwelin</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --text: #f5f8fc; --muted: #a9b8c8; --line: rgba(222, 237, 255, .14);
      --panel: rgba(255,255,255,.075); --accent: #a9e3dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(ellipse at 12% 0, #315674 0, transparent 40%), linear-gradient(145deg, #101a25, #1a2c3b 58%, #26364a);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1120px, 100%); margin: 0 auto; padding: 28px clamp(16px, 4vw, 42px) 36px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 1.05rem; font-weight: 750; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(145deg, #ffe09a, #ffae79); color: #233346; font-size: 1.2rem; }
    .search { display: flex; width: min(440px, 65%); gap: 8px; }
    .search input { min-width: 0; flex: 1; padding: 12px 15px; border: 1px solid var(--line); border-radius: 13px; outline: none; background: rgba(7,18,30,.48); color: var(--text); }
    .search input:focus { border-color: rgba(169,227,220,.8); box-shadow: 0 0 0 3px rgba(169,227,220,.12); }
    .search button, .location-button, .units button { border: 1px solid var(--line); background: rgba(255,255,255,.08); cursor: pointer; }
    .search button { padding: 0 17px; border-radius: 13px; font-weight: 650; }
    .search button:hover, .location-button:hover, .units button:hover { background: rgba(255,255,255,.15); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; }
    .eyebrow { color: var(--muted); font-size: .8rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    .toolbar-actions { display: flex; align-items: center; gap: 10px; }
    .location-button { min-height: 38px; padding: 0 12px; border-radius: 10px; }
    .units { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: rgba(7,18,30,.35); }
    .units button { width: 36px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
    .units button[aria-pressed="true"] { background: rgba(255,255,255,.17); color: var(--text); }
    .hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 15px; }
    .card { border: 1px solid var(--line); border-radius: 21px; background: var(--panel); box-shadow: 0 16px 48px rgba(0,0,0,.13); backdrop-filter: blur(15px); }
    .current { min-height: 270px; padding: clamp(22px, 4vw, 36px); }
    .place { color: var(--muted); font-size: 1rem; }
    .current-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .temperature { margin: 12px 0 3px; font-size: clamp(4.5rem, 11vw, 7rem); font-weight: 300; letter-spacing: -.09em; line-height: 1; }
    .condition { font-size: 1.1rem; font-weight: 650; }
    .weather-icon { font-size: clamp(5rem, 13vw, 8rem); filter: drop-shadow(0 10px 20px rgba(255,210,120,.2)); }
    .highlow { margin-top: 12px; color: var(--muted); }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; padding: 17px; }
    .detail { display: flex; min-height: 106px; flex-direction: column; justify-content: center; padding: 14px; border-radius: 15px; background: rgba(255,255,255,.055); }
    .detail-label { color: var(--muted); font-size: .85rem; }
    .detail-value { margin-top: 8px; font-size: 1.3rem; font-weight: 720; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 2px 13px; }
    h2 { margin: 0; font-size: 1.12rem; }
    .forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 11px; }
    .day { min-width: 0; padding: 16px 8px; text-align: center; }
    .day-name { font-weight: 680; }
    .day-icon { margin: 10px 0 8px; font-size: 1.8rem; }
    .day-condition { min-height: 2.4em; color: var(--muted); font-size: .75rem; line-height: 1.2; }
    .day-high { margin-top: 8px; font-weight: 720; }
    .day-low { margin-top: 3px; color: var(--muted); font-size: .88rem; }
    .hourly { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-color: #70869a transparent; }
    .hour { flex: 0 0 92px; padding: 14px 10px; text-align: center; }
    .hour-time { color: var(--muted); font-size: .82rem; }
    .hour-icon { margin: 8px 0; font-size: 1.5rem; }
    .hour-temp { font-weight: 720; }
    .status { min-height: 24px; margin: 16px 2px 0; color: var(--muted); font-size: .88rem; line-height: 1.5; }
    .status.error { color: #ffc0b8; }
    footer { margin-top: 22px; color: rgba(210,223,240,.66); font-size: .8rem; text-align: center; }
    footer a { color: inherit; }
    @media (max-width: 700px) {
      .shell { padding-top: 19px; }
      header { align-items: flex-start; flex-direction: column; margin-bottom: 24px; }
      .search { width: 100%; }
      .hero { grid-template-columns: 1fr; }
      .current { min-height: 240px; }
      .details { grid-template-columns: repeat(4, 1fr); padding: 11px; }
      .detail { min-height: 88px; padding: 10px; }
      .detail-value { font-size: 1.08rem; }
      .forecast { grid-template-columns: repeat(5, minmax(68px, 1fr)); gap: 7px; overflow-x: auto; padding-bottom: 5px; }
      .day { padding: 14px 5px; }
    }
    @media (max-width: 440px) {
      .toolbar { align-items: flex-start; flex-direction: column; }
      .details { grid-template-columns: 1fr 1fr; }
      .temperature { font-size: 5rem; }
      .weather-icon { font-size: 5rem; }
      .location-button { min-height: 36px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">☀</span> Shwelin Weather</div>
      <form class="search" id="searchForm" role="search">
        <input id="cityInput" type="search" placeholder="Search a city…" aria-label="Search city" autocomplete="off" required>
        <button type="submit">Search</button>
      </form>
    </header>

    <section aria-label="Current weather">
      <div class="toolbar">
        <div class="eyebrow">Current conditions</div>
        <div class="toolbar-actions">
          <button class="location-button" id="locationButton" type="button">◎ Use my location</button>
          <div class="units" role="group" aria-label="Temperature units">
            <button type="button" id="celsiusButton" aria-pressed="true">°C</button>
            <button type="button" id="fahrenheitButton" aria-pressed="false">°F</button>
          </div>
        </div>
      </div>
      <div class="hero">
        <article class="card current">
          <div class="place" id="place">Loading weather…</div>
          <div class="current-main">
            <div>
              <div class="temperature" id="temperature">--°</div>
              <div class="condition" id="condition">Fetching conditions</div>
              <div class="highlow" id="highlow">Today: --° / --°</div>
            </div>
            <div class="weather-icon" id="weatherIcon" aria-hidden="true">⛅</div>
          </div>
        </article>
        <article class="card details" aria-label="Weather details">
          <div class="detail"><div class="detail-label">Feels like</div><div class="detail-value" id="feelsLike">--°</div></div>
          <div class="detail"><div class="detail-label">Humidity</div><div class="detail-value" id="humidity">--%</div></div>
          <div class="detail"><div class="detail-label">Wind</div><div class="detail-value" id="wind">--</div></div>
          <div class="detail"><div class="detail-label">Rain chance</div><div class="detail-value" id="rain">--%</div></div>
        </article>
      </div>
    </section>

    <section aria-label="Hourly forecast">
      <div class="section-heading"><h2>Next 24 hours</h2><span class="eyebrow" id="timezoneLabel"></span></div>
      <div class="hourly" id="hourly" aria-live="polite"></div>
    </section>
    <section aria-label="Five-day forecast">
      <div class="section-heading"><h2>5-day forecast</h2></div>
      <div class="forecast" id="forecast"></div>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · Free public API, no API key required</footer>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      let unit = 'celsius';
      let latestRequest = 0;
      let currentData = null;
      let currentPlace = '';

      const conditions = {
        0: ['Clear sky', '☀️'], 1: ['Mainly clear', '🌤️'], 2: ['Partly cloudy', '⛅'], 3: ['Overcast', '☁️'],
        45: ['Foggy', '🌫️'], 48: ['Rime fog', '🌫️'], 51: ['Light drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Heavy drizzle', '🌧️'],
        56: ['Freezing drizzle', '🌧️'], 57: ['Heavy freezing drizzle', '🌧️'], 61: ['Light rain', '🌦️'], 63: ['Rain', '🌧️'], 65: ['Heavy rain', '🌧️'],
        66: ['Freezing rain', '🌧️'], 67: ['Heavy freezing rain', '🌧️'], 71: ['Light snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy snow', '❄️'], 77: ['Snow grains', '🌨️'],
        80: ['Rain showers', '🌦️'], 81: ['Rain showers', '🌧️'], 82: ['Heavy showers', '🌧️'], 85: ['Snow showers', '🌨️'], 86: ['Heavy snow showers', '❄️'],
        95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm with hail', '⛈️'], 99: ['Heavy thunderstorm', '⛈️']
      };
      const description = (code) => conditions[code] || ['Conditions unavailable', '🌡️'];
      const toDisplayTemp = (value) => Math.round(unit === 'fahrenheit' ? (value * 9 / 5 + 32) : value);
      const temp = (value) => `${toDisplayTemp(value)}°`;
      const setStatus = (text, error = false) => {
        $('status').textContent = text;
        $('status').classList.toggle('error', error);
      };

      async function geocode(cityName) {
        const url = new URL('https://geocoding-api.open-meteo.com/v1/search');
        url.search = new URLSearchParams({ name: cityName, count: '1', language: 'en', format: 'json' }).toString();
        const response = await fetch(url);
        if (!response.ok) throw new Error('City search is temporarily unavailable. Try again.');
        const result = await response.json();
        if (!result.results || !result.results.length) throw new Error('City not found. Check the spelling and try again.');
        const city = result.results[0];
        return { latitude: city.latitude, longitude: city.longitude, name: city.name, region: city.admin1 || '', country: city.country || '' };
      }

      async function loadWeather(location) {
        const requestId = ++latestRequest;
        currentPlace = [location.name, location.region, location.country].filter(Boolean).join(', ');
        $('place').textContent = currentPlace || 'Selected location';
        setStatus('Loading current conditions and forecasts…');
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.search = new URLSearchParams({
          latitude: String(location.latitude), longitude: String(location.longitude),
          current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation_probability,weather_code,wind_speed_10m',
          hourly: 'temperature_2m,precipitation_probability,weather_code',
          daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
          forecast_days: '5', forecast_hours: '24', timezone: 'auto', wind_speed_unit: 'kmh'
        }).toString();
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('Weather service is temporarily unavailable. Please try again.');
          const data = await response.json();
          if (requestId !== latestRequest) return;
          if (!data.current || !data.daily || !data.hourly) throw new Error('Weather data was incomplete. Please try again.');
          currentData = data;
          render(data);
          setStatus(`Updated ${new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', timeZone: data.timezone }).format(new Date())}`);
        } catch (error) {
          if (requestId === latestRequest) setStatus(error.message || 'Unable to load weather. Check your internet connection.', true);
        }
      }

      function render(data) {
        const current = data.current;
        const daily = data.daily;
        const [label, icon] = description(current.weather_code);
        $('place').textContent = currentPlace;
        $('temperature').textContent = temp(current.temperature_2m);
        $('condition').textContent = label;
        $('weatherIcon').textContent = current.is_day ? icon : (current.weather_code === 0 ? '🌙' : icon);
        $('feelsLike').textContent = temp(current.apparent_temperature);
        $('humidity').textContent = `${Math.round(current.relative_humidity_2m)}%`;
        $('wind').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
        $('rain').textContent = `${Math.round(current.precipitation_probability ?? daily.precipitation_probability_max?.[0] ?? 0)}%`;
        $('highlow').textContent = `Today: ${temp(daily.temperature_2m_max[0])} / ${temp(daily.temperature_2m_min[0])}`;
        $('timezoneLabel').textContent = (data.timezone || '').replaceAll('_', ' ');

        const hourTimes = data.hourly.time;
        let currentHourIndex = hourTimes.findIndex((time) => time >= current.time);
        if (currentHourIndex < 0) currentHourIndex = 0;
        const hourCards = hourTimes.slice(currentHourIndex, currentHourIndex + 24).map((time, offset) => {
          const index = currentHourIndex + offset;
          const [weather, weatherIcon] = description(data.hourly.weather_code[index]);
          const hourLabel = offset === 0 ? 'Now' : new Intl.DateTimeFormat(undefined, { hour: 'numeric', timeZone: data.timezone }).format(new Date(`${time}:00`));
          return `<article class="card hour" aria-label="${hourLabel}, ${weather}, ${toDisplayTemp(data.hourly.temperature_2m[index])} degrees">
            <div class="hour-time">${hourLabel}</div><div class="hour-icon" aria-hidden="true">${weatherIcon}</div><div class="hour-temp">${temp(data.hourly.temperature_2m[index])}</div>
          </article>`;
        }).join('');
        $('hourly').innerHTML = hourCards;

        $('forecast').innerHTML = daily.time.map((date, index) => {
          const dayName = index === 0 ? 'Today' : new Intl.DateTimeFormat(undefined, { weekday: 'short', timeZone: data.timezone }).format(new Date(`${date}T12:00:00`));
          const [weather, weatherIcon] = description(daily.weather_code[index]);
          const card = document.createElement('article');
          card.className = 'card day';
          card.setAttribute('aria-label', `${dayName}: ${weather}, high ${toDisplayTemp(daily.temperature_2m_max[index])} degrees, low ${toDisplayTemp(daily.temperature_2m_min[index])} degrees`);
          card.innerHTML = `<div class="day-name"></div><div class="day-icon" aria-hidden="true"></div><div class="day-condition"></div><div class="day-high"></div><div class="day-low"></div>`;
          card.querySelector('.day-name').textContent = dayName;
          card.querySelector('.day-icon').textContent = weatherIcon;
          card.querySelector('.day-condition').textContent = weather;
          card.querySelector('.day-high').textContent = `↑ ${temp(daily.temperature_2m_max[index])}`;
          card.querySelector('.day-low').textContent = `↓ ${temp(daily.temperature_2m_min[index])}`;
          return card;
        });
      }

      $('searchForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const query = $('cityInput').value.trim();
        if (!query) return;
        setStatus('Searching for city…');
        try { await loadWeather(await geocode(query)); }
        catch (error) { setStatus(error.message || 'Unable to find that city.', true); }
      });

      $('locationButton').addEventListener('click', () => {
        if (!navigator.geolocation) {
          setStatus('Location is not supported by this browser. Search for a city instead.', true);
          return;
        }
        setStatus('Requesting your location…');
        navigator.geolocation.getCurrentPosition(({ coords }) => {
          loadWeather({ latitude: coords.latitude, longitude: coords.longitude, name: 'Your location', region: '', country: '' });
        }, (error) => {
          const message = error.code === 1 ? 'Location permission was denied. Allow access or search for a city.' : 'Unable to get your location. Search for a city instead.';
          setStatus(message, true);
        }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
      });

      function setUnit(nextUnit) {
        unit = nextUnit;
        $('celsiusButton').setAttribute('aria-pressed', String(unit === 'celsius'));
        $('fahrenheitButton').setAttribute('aria-pressed', String(unit === 'fahrenheit'));
        if (currentData) render(currentData);
      }
      $('celsiusButton').addEventListener('click', () => setUnit('celsius'));
      $('fahrenheitButton').addEventListener('click', () => setUnit('fahrenheit'));

      // Default to Yangon; city search and device location are also available.
      loadWeather({ latitude: 16.8661, longitude: 96.1951, name: 'Yangon', region: '', country: 'Myanmar' });
    })();
  </script>
</body>
</html>
