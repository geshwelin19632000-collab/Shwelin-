<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <title>Shwelin Video Player</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #10131a; color: #f4f6fb; }
    main { width: min(100%, 900px); }
    h1 { font-size: clamp(1.25rem, 4vw, 1.8rem); margin: 0 0 1rem; }
    .player { overflow: hidden; border-radius: 12px; background: #000; }
    video { display: block; width: 100%; max-height: 72vh; aspect-ratio: 16 / 9; background: #000; object-fit: contain; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-top: 1rem; }
    .pick { display: inline-flex; align-items: center; min-height: 44px; padding: .65rem 1rem; border-radius: 8px; background: #3768d9; color: white; font-weight: 650; cursor: pointer; }
    .pick:focus-within, .pick:focus { outline: 3px solid #a9c2ff; outline-offset: 3px; }
    input[type="file"] { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    #filename { overflow-wrap: anywhere; color: #c9d1e2; }
    #message { min-height: 1.5em; margin: .85rem 0 0; color: #c9d1e2; line-height: 1.5; }
    #message.error { color: #ffb4ab; }
    .hint { margin-top: .5rem; color: #a9b2c4; font-size: .9rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Shwelin Video Player</h1>
    <div class="player">
      <video id="video" controls playsinline webkit-playsinline preload="metadata" aria-label="Video player">
        သင့်ဘရောက်ဆာသည် ဗီဒီယိုဖွင့်ခြင်းကို မပံ့ပိုးပါ။
      </video>
    </div>
    <div class="controls">
      <label class="pick" for="videoFile">ဗီဒီယိုဖိုင်ရွေးရန်</label>
      <input id="videoFile" type="file" accept="video/*,.mp4,.m4v,.mov,.webm,.ogv,.ogg,.mkv,.avi,.3gp,.mpeg,.mpg,.ts">
      <span id="filename" aria-live="polite">ဖိုင်ရွေးချယ်ထားခြင်း မရှိသေးပါ</span>
    </div>
    <p id="message" role="status" aria-live="polite">ဗီဒီယိုဖိုင်တစ်ခု ရွေးပါ။</p>
    <p class="hint">ဖွင့်နိုင်မှုသည် ဖိုင်အတွင်းရှိ video/audio codec နှင့် ဘရောက်ဆာပံ့ပိုးမှုအပေါ် မူတည်ပါသည်။</p>
  </main>
  <script>
    (() => {
      const input = document.getElementById('videoFile');
      const video = document.getElementById('video');
      const filename = document.getElementById('filename');
      const message = document.getElementById('message');
      let currentUrl = null;

      function showMessage(text, isError = false) {
        message.textContent = text;
        message.classList.toggle('error', isError);
      }

      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file) return;

        // The browser's file.type may be empty or inaccurate. Use the local Blob URL
        // directly rather than declaring a possibly incorrect <source type>.
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentUrl = URL.createObjectURL(file);
        filename.textContent = file.name;
        showMessage('ဗီဒီယိုကို ဖွင့်ရန် ပြင်ဆင်နေသည်…');
        video.pause();
        video.removeAttribute('src');
        video.src = currentUrl;
        video.load();
      });

      video.addEventListener('loadedmetadata', () => {
        showMessage('ဗီဒီယိုအသင့်ဖြစ်ပါပြီ။ ဖွင့်ရန် play ကိုနှိပ်ပါ။');
      });

      video.addEventListener('error', () => {
        const errorCode = video.error && video.error.code;
        const details = {
          1: 'ဖွင့်ခြင်းကို ရပ်တန့်လိုက်ပါသည်။',
          2: 'ဖိုင်ကို ဖတ်ရှုရာတွင် အမှားဖြစ်နေပါသည်။ ဖိုင်ကို ပြန်ရွေးကြည့်ပါ။',
          3: 'ဗီဒီယိုကို decode လုပ်၍မရပါ။ ဖိုင်ပျက်နေနိုင်သည် သို့မဟုတ် codec ကို ဘရောက်ဆာက မပံ့ပိုးနိုင်ပါ။',
          4: 'ဤဖိုင်အမျိုးအစား သို့မဟုတ် ၎င်း၏ codec ကို ဘရောက်ဆာက မပံ့ပိုးပါ။ MP4 (H.264/AAC) သို့မဟုတ် WebM (VP8/VP9) အဖြစ် ပြောင်းပြီး ထပ်စမ်းပါ။'
        };
        showMessage(details[errorCode] || 'ဤဗီဒီယိုကို ဖွင့်၍မရပါ။ အခြားဖိုင်တစ်ခုဖြင့် ထပ်စမ်းပါ။', true);
      });

      // Release the temporary local-file URL when leaving the page.
      window.addEventListener('pagehide', () => {
        if (currentUrl) URL.revokeObjectURL(currentUrl);
      });
    })();
  </script>
</body>
</html>
